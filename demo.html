<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员制产品小程序 · 交互 Demo</title>
<style>
:root{
  --green:#07C160; --green-dark:#06a854; --ink:#1a1a1a; --sub:#8a8a8e;
  --line:#ececf0; --bg:#f5f6f8; --gold:#c9a063; --core:#3d3d52;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#e8eaee;min-height:100vh;display:flex;gap:48px;align-items:center;justify-content:center;padding:32px 16px;color:var(--ink);flex-wrap:wrap}

/* ---------- 演示控制台 ---------- */
.console{width:300px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(20,24,40,.08)}
.console h1{font-size:17px;margin-bottom:4px}
.console .desc{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:16px}
.console .step{font-size:12.5px;color:#555;line-height:1.8;margin-bottom:14px;padding-left:14px;border-left:2px solid var(--green)}
.code-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.code-row .code{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#f4f5f7;border:1px dashed #cfd2d8;border-radius:8px;padding:8px 10px;letter-spacing:.5px}
.code-row .lv{font-size:11px;color:#fff;background:var(--sub);border-radius:4px;padding:2px 7px;white-space:nowrap}
.code-row .lv.l1{background:#7c8db0}.code-row .lv.l2{background:var(--gold)}.code-row .lv.l3{background:var(--core)}
.copy-btn{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:7px 10px;cursor:pointer;color:#555}
.copy-btn:active{background:#f0f0f2}
.console .who{margin-top:16px;font-size:12.5px;color:#555;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.console .who b{color:var(--ink)}
.reset-btn{margin-top:14px;width:100%;border:1px solid #e5c8c8;background:#fff5f5;color:#c0504d;border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.reset-btn:active{background:#ffecec}

/* ---------- 手机壳 ---------- */
.phone{width:390px;height:844px;background:#0d0d10;border-radius:54px;padding:11px;box-shadow:0 30px 80px rgba(15,18,30,.35),inset 0 0 0 2px #2a2a30;flex-shrink:0}
.screen{width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:var(--bg);z-index:20;flex-shrink:0}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.navbar{height:44px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg);flex-shrink:0;z-index:20}
.navbar .title{font-size:16px;font-weight:600}
.navbar .back{position:absolute;left:14px;width:26px;height:26px;display:none;align-items:center;justify-content:center;cursor:pointer}
.capsule{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;border:1px solid rgba(0,0,0,.08);border-radius:14px;background:rgba(255,255,255,.7);overflow:hidden}
.capsule span{width:38px;height:26px;display:flex;align-items:center;justify-content:center}
.capsule span+span{border-left:1px solid rgba(0,0,0,.06)}

.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;background:var(--bg);display:none;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{display:block}
.page.pushed{z-index:15}

/* ---------- 底部 Tab ---------- */
.tabbar{height:78px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:18px;flex-shrink:0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#9a9aa0;cursor:pointer}
.tab.on{color:var(--green)}
.tab svg{width:24px;height:24px}

/* ---------- 首页视频流 ---------- */
.home-head{padding:6px 16px 12px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:700;letter-spacing:.5px}
.brand small{font-size:11px;color:var(--sub);font-weight:400;margin-left:8px}
.video-list{padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px}
.vcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,40,.05)}
.vcard .thumb{position:relative;aspect-ratio:16/9;background:#222}
.vcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vcard .thumb .play i{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
.vcard .thumb .dur{position:absolute;right:10px;bottom:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:5px}
.vcard .thumb .pin-tag{position:absolute;left:10px;top:10px;font-size:11px;color:#fff;background:var(--green);padding:3px 8px;border-radius:5px;font-weight:600}
.vcard .vinfo{padding:11px 13px 13px}
.vcard .vtitle{font-size:14.5px;font-weight:600;line-height:1.4}
.vcard .vsrc{margin-top:5px;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:4px}
.vcard .vsrc .dot{width:4px;height:4px;border-radius:50%;background:#c9c9cf}

/* ---------- 锁定页 ---------- */
.locked{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;text-align:center}
.locked .lock-ic{width:64px;height:64px;border-radius:20px;background:#eef0f3;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.locked h3{font-size:16px;margin-bottom:8px}
.locked p{font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:22px}
.btn-primary{background:var(--green);color:#fff;border:none;border-radius:22px;padding:11px 34px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:active{background:var(--green-dark)}

/* ---------- 产品库 ---------- */
.search-wrap{padding:10px 14px;background:#fff;position:sticky;top:0;z-index:5}
.search-box{display:flex;align-items:center;gap:7px;background:#f2f3f5;border-radius:18px;padding:8px 14px}
.search-box input{border:none;background:none;outline:none;font-size:13.5px;flex:1}
.cats{display:flex;gap:8px;padding:11px 14px 4px;background:#fff;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;font-size:12.5px;padding:6px 14px;border-radius:15px;background:#f2f3f5;color:#666;cursor:pointer}
.cat.on{background:#e6f7ee;color:var(--green);font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px 14px 20px}
.pcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(20,24,40,.05);cursor:pointer}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.pcard .pbody{padding:9px 11px 12px}
.pcard .pname{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pno{font-size:11px;color:var(--sub);margin-top:3px;font-family:ui-monospace,Menlo,monospace}
.pcard .pprice{margin-top:6px;color:#e6432d;font-size:15px;font-weight:700}
.pcard .pprice small{font-size:10.5px;color:var(--sub);font-weight:400;margin-left:4px}
.empty-tip{text-align:center;color:var(--sub);font-size:12.5px;padding:50px 0;grid-column:1/-1}

/* ---------- 产品详情 ---------- */
.detail-hero{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.detail-body{padding:16px}
.detail-body h2{font-size:18px;line-height:1.4}
.detail-meta{display:flex;gap:8px;align-items:center;margin:8px 0 14px;font-size:12px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
.price-box{background:linear-gradient(135deg,#fff8f0,#fff);border:1px solid #f3e3cf;border-radius:12px;padding:14px 16px;display:flex;align-items:baseline;justify-content:space-between}
.price-box .pv{font-size:26px;font-weight:800;color:#e6432d}
.price-box .pv::before{content:"¥";font-size:15px;margin-right:2px}
.price-box .pl{font-size:11.5px;color:var(--gold);font-weight:600}
.detail-desc{margin-top:16px;font-size:13.5px;color:#555;line-height:1.9}
.detail-desc b{display:block;color:var(--ink);margin-bottom:6px;font-size:14px}

/* ---------- 查价 ---------- */
.query-wrap{padding:18px 14px}
.query-card{background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 2px 10px rgba(20,24,40,.05)}
.query-card label{font-size:13px;font-weight:600;display:block;margin-bottom:10px}
.query-line{display:flex;gap:9px}
.query-line input{flex:1;border:1.5px solid #dcdde2;border-radius:10px;padding:11px 13px;font-size:15px;outline:none;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;text-transform:uppercase}
.query-line input:focus{border-color:var(--green)}
.query-line button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:0 22px;font-size:14px;font-weight:600;cursor:pointer}
.query-hint{margin-top:10px;font-size:11.5px;color:var(--sub)}
.qresult{margin-top:14px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,40,.05);display:none}
.qresult.show{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qresult img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.qresult .qb{padding:14px 16px 16px}
.qresult .qn{font-size:16px;font-weight:700}
.qresult .qno{font-size:12px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:3px}
.qresult .qp{margin-top:12px;display:flex;align-items:baseline;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px}
.qresult .qp .v{font-size:24px;font-weight:800;color:#e6432d}
.qresult .qp .v::before{content:"¥";font-size:14px;margin-right:2px}
.qresult .qp .t{font-size:11.5px;color:var(--gold);font-weight:600}
.qerr{margin-top:14px;background:#fff;border:1px solid #f2d3cf;border-radius:14px;padding:22px 16px;text-align:center;display:none}
.qerr.show{display:block;animation:rise .3s ease}
.qerr .ic{font-size:0;width:46px;height:46px;border-radius:50%;background:#fdf0ef;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.qerr p{font-size:13.5px;color:#c0504d;font-weight:600}
.qerr span{display:block;font-size:12px;color:var(--sub);margin-top:5px}

/* ---------- 投票 ---------- */
.vote-list{padding:14px;display:flex;flex-direction:column;gap:12px}
.vote-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,40,.05);cursor:pointer}
.vote-card img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.vote-card .vb{padding:13px 15px 15px}
.vote-card .vt{font-size:15px;font-weight:700;line-height:1.4}
.vote-card .vm{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub)}
.badge{font-size:10.5px;padding:2px 8px;border-radius:4px;font-weight:600}
.badge.doing{background:#e6f7ee;color:var(--green)}
.badge.done{background:#f0f0f2;color:#9a9aa0}
.vote-hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vote-body{padding:18px 16px}
.vote-body h2{font-size:17.5px;line-height:1.45}
.vote-body .deadline{font-size:12px;color:var(--sub);margin:7px 0 4px}
.vote-body .intro{font-size:13px;color:#555;line-height:1.85;margin:10px 0 18px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid #e3e4e8;border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.opt.sel{border-color:var(--green);background:#f2fbf6}
.opt .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #c8c9cf;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.sel .radio{border-color:var(--green)}
.opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}
.opt .ot{font-size:14px}
.rbar{border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#f4f5f7;position:relative;overflow:hidden}
.rbar .fill{position:absolute;left:0;top:0;bottom:0;background:#d9f2e4;width:0;transition:width .6s ease}
.rbar.mine .fill{background:#bfe9d2}
.rbar .rl{position:relative;display:flex;justify-content:space-between;font-size:13.5px}
.rbar .rl b{font-weight:600}
.rbar .mine-tag{font-size:10px;color:var(--green);border:1px solid var(--green);border-radius:3px;padding:0 4px;margin-left:5px;font-weight:600}
.vote-btn{width:100%;border:none;background:var(--green);color:#fff;border-radius:24px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.vote-btn:disabled{background:#c9c9cf;cursor:not-allowed}
.vote-note{text-align:center;font-size:11.5px;color:var(--sub);margin-top:10px}
.share-row{display:flex;gap:10px;margin-top:16px}
.share-row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:13px;color:#444;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.share-row button:active{background:#f5f5f7}
.vote-count{font-size:12px;color:var(--sub);margin:2px 0 12px}

/* ---------- 我的 ---------- */
.mine-head{background:linear-gradient(160deg,#0f9d58,#07C160);padding:30px 20px 26px;color:#fff;display:flex;align-items:center;gap:14px}
.mine-head img{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.mine-head .mn{font-size:18px;font-weight:700}
.mine-head .ms{font-size:12px;opacity:.85;margin-top:4px}
.lv-badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:9px;background:rgba(255,255,255,.22);font-weight:600;margin-top:6px}
.activate-card{margin:14px;background:#fff;border-radius:14px;padding:20px 16px;box-shadow:0 2px 10px rgba(20,24,40,.05)}
.activate-card h3{font-size:15px;margin-bottom:5px}
.activate-card .sub{font-size:12px;color:var(--sub);margin-bottom:14px}
.activate-card input{width:100%;border:1.5px solid #dcdde2;border-radius:10px;padding:12px 13px;font-size:15px;outline:none;font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.activate-card input:focus{border-color:var(--green)}
.activate-card .btn-primary{width:100%;border-radius:12px;padding:12px}
.activate-card .tip{font-size:11.5px;color:var(--sub);margin-top:11px;text-align:center}
.menu{margin:14px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,40,.05)}
.mi{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;font-size:14px;cursor:pointer}
.mi+.mi{border-top:1px solid var(--line)}
.mi .arrow{color:#c5c5cb}

/* ---------- 弹层 / 浮层 ---------- */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:22px 20px 34px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h4{font-size:15px;text-align:center;margin-bottom:8px}
.sheet p{font-size:12.5px;color:var(--sub);line-height:1.8;text-align:center;margin-bottom:18px}
.sheet .btn-primary{width:100%;border-radius:12px;padding:12px}
.sheet .ghost{width:100%;margin-top:10px;border:none;background:none;color:var(--sub);font-size:13px;padding:8px;cursor:pointer}
.dialog{width:78%;background:#fff;border-radius:14px;padding:22px 20px 16px;animation:up .25s ease;text-align:center}
.dialog h4{font-size:15.5px;margin-bottom:8px}
.dialog p{font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:16px}
.dialog .dbtns{display:flex;border-top:1px solid var(--line)}
.dialog .dbtns button{flex:1;border:none;background:none;padding:13px;font-size:15px;cursor:pointer;color:var(--sub)}
.dialog .dbtns button.ok{color:var(--green);font-weight:700;border-left:1px solid var(--line)}
.mask.center{align-items:center;justify-content:center}

.player{position:absolute;inset:0;background:#000;z-index:70;display:none;flex-direction:column}
.player.show{display:flex}
.player .pstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.player .pstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.player .pbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:2}
.player .pclose{position:absolute;top:52px;left:16px;z-index:3;color:#fff;font-size:13px;background:rgba(255,255,255,.15);border-radius:14px;padding:6px 12px;cursor:pointer}
.player .ptitle{position:absolute;left:16px;bottom:22px;right:16px;color:#fff;z-index:2}
.player .ptitle b{font-size:15px;display:block;margin-bottom:4px}
.player .ptitle span{font-size:11.5px;opacity:.75}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2)}
.progress i{display:block;height:100%;width:0;background:var(--green)}
.ch-tag{position:absolute;top:52px;right:16px;z-index:3;font-size:10.5px;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.35);padding:3px 9px;border-radius:5px}

.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:11px 20px;border-radius:10px;z-index:90;display:none;max-width:70%;text-align:center;line-height:1.5}
.toast.show{display:block;animation:rise .2s ease}
</style>
</head>
<body>

<!-- ============ 演示控制台 ============ -->
<div class="console">
  <h1>小程序交互 Demo</h1>
  <div class="desc">基于需求文档 v1.0 制作，模拟真实小程序的页面与权限逻辑。数据均为演示数据。</div>
  <div class="step">① 默认是<b>游客</b>身份：可浏览首页视频和投票，产品库与查价被锁定。<br>② 进入「我的」Tab，输入下方任一邀请码开通会员。<br>③ 不同等级邀请码对应不同价格，可重置后换码对比。</div>
  <div class="code-row"><div class="code">PT8A0001</div><span class="lv l1">普通会员</span><button class="copy-btn" data-c="PT8A0001">复制</button></div>
  <div class="code-row"><div class="code">GJ8B0002</div><span class="lv l2">高级会员</span><button class="copy-btn" data-c="GJ8B0002">复制</button></div>
  <div class="code-row"><div class="code">HX8C0003</div><span class="lv l3">核心会员</span><button class="copy-btn" data-c="HX8C0003">复制</button></div>
  <div class="who"><span>当前身份</span><b id="whoami">游客</b></div>
  <button class="reset-btn" id="resetBtn">重置演示</button>
</div>

<!-- ============ 手机 ============ -->
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span>
    <div class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".5"/></svg>
    </div>
  </div>
  <div class="navbar">
    <div class="back" id="navBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="title" id="navTitle">臻选生活馆</div>
    <div class="capsule">

<script>
/* ================= 数据 ================= */
const IMG = p => `https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${encodeURIComponent(p)}&image_size=`;
const videos = [
  {pin:true, title:"3 分钟了解这个小程序：查价、订货、新品投票", dur:"03:12", sub:"置顶介绍 · 来自视频号「臻选生活馆」",
   cover:IMG("premium lifestyle products arranged on beige studio background, ceramic cup, aroma diffuser, soft light, e-commerce hero shot, photorealistic")+"landscape_16_9"},
  {title:"秋季新品开箱：香薰加湿器实拍", dur:"01:48", sub:"来自视频号「臻选生活馆」",
   cover:IMG("unboxing scene of a modern aroma diffuser on wooden desk, warm light, hands opening box, photorealistic")+"landscape_16_9"},
  {title:"仓库直拍：本期授权产品发货质检流程", dur:"02:35", sub:"来自视频号「臻选生活馆」",
   cover:IMG("clean warehouse quality inspection of home goods parcels, worker scanning boxes, bright daylight, photorealistic")+"landscape_16_9"},
  {title:"客户案例：实体店陈列搭配参考", dur:"04:02", sub:"来自视频号「臻选生活馆」",
   cover:IMG("boutique store shelf display of minimalist home living products, scandinavian style, soft ambient lighting, photorealistic")+"landscape_16_9"},
];
const LEVELS = ["普通会员","高级会员","核心会员"];
const products = [
  {no:"A-1024", name:"北欧陶瓷马克杯 四件套", cat:"杯壶餐厨", prices:[89,75,62], off:false,
   desc:"哑光釉面陶瓷，350ml × 4 色混装，适配洗碗机与微波炉。整箱 12 套起订，支持一件代发。",
   img:IMG("set of four nordic matte ceramic mugs in pastel colors on light gray background, product photography, soft shadow")+"square"},
  {no:"A-1025", name:"香薰加湿器 300ml", cat:"家居电器", prices:[199,169,139], off:false,
   desc:"超声波静音加湿，支持香薰精油，7 色氛围灯，缺水自动断电。质保一年。",
   img:IMG("modern white aroma diffuser humidifier with soft mist on wooden table, cozy warm lighting, product photography")+"square"},
  {no:"A-1026", name:"全光谱护眼台灯", cat:"家居电器", prices:[259,219,179], off:false,
   desc:"Ra95 显色指数，三档色温无极调光，触控面板，折叠收纳。国标 AA 级照度。",
   img:IMG("minimalist white desk lamp glowing softly on study desk with books, evening ambient, product photography")+"square"},
  {no:"B-2001", name:"折叠收纳箱 三件套", cat:"收纳床品", prices:[129,109,89], off:false,
   desc:"加厚牛津布 + 钢架结构，可视窗设计，55L/40L/28L 组合，可叠放。",
   img:IMG("three beige fabric storage boxes with steel frame stacked in bright closet, organized home, product photography")+"square"},
  {no:"B-2002", name:"恒温电热水壶 1.5L", cat:"杯壶餐厨", prices:[329,279,229], off:false,
   desc:"316 不锈钢内胆，45-100℃ 每 5℃ 一档精准控温，24 小时保温，防干烧。",
   img:IMG("sleek stainless steel electric kettle with digital temperature display on kitchen counter, product photography")+"square"},
  {no:"B-2003", name:"全棉水洗棉四件套", cat:"收纳床品", prices:[399,339,289], off:false,
   desc:"100 支长绒棉，A 类母婴级面料，1.5m/1.8m 床通用，多色可选。",
   img:IMG("soft washed cotton bedding set in cream color neatly arranged on bed, morning light through window, product photography")+"square"},
  {no:"A-1099", name:"旧款便携料理机", cat:"家居电器", prices:[159,135,115], off:true,
   desc:"已停产下架。", img:""},
];
const CATS = ["全部","杯壶餐厨","家居电器","收纳床品"];
const votes = [
  {id:1, title:"新品「便携榨汁杯」是否上架？", deadline:"截止 9 月 30 日 23:59", doing:true, voted:86,
   intro:"350ml 便携榨汁杯，磁吸充电，40 秒鲜榨。预计普通会员价 ¥129 起，上市前想听听大家的拿货意向。",
   options:["会上架，期待","观望，看价格再定","不感兴趣"], ratio:[45,38,17],
   img:IMG("portable blender cup with fresh orange juice and fruit slices on bright kitchen table, product photography, vibrant")+"landscape_16_9"},
  {id:2, title:"新品「智能体脂秤」上架意向", deadline:"已于 9 月 15 日截止", doing:false, voted:124,
   intro:"蓝牙连接、18 项身体数据。投票已结束，结果供选品参考。",
   options:["会上架，期待","观望，看价格再定","不感兴趣"], ratio:[58,31,11],
   img:IMG("smart body scale on wooden floor in bright bathroom, minimalist style, product photography")+"landscape_16_9"},
];
const CODES = {"PT8A0001":0,"GJ8B0002":1,"HX8C0003":2};
const USED_CODES = {"OLD00001":"该邀请码次数已用完"};
const EXP_CODES = {"EXP20251":"该邀请码已过期"};

/* ================= 状态 ================= */
let state = { member:null, voted:{}, selOpt:{}, tab:"home", pushed:null };
let playerTimer=null;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
function toast(msg, ms=1800){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),ms); }
function openSheet(html){ $("sheetBox").innerHTML=html; $("sheetMask").classList.add("show"); }
function openDlg(html){ $("dlgBox").innerHTML=html; $("dlgMask").classList.add("show"); }
$("sheetMask").addEventListener("click",e=>{ if(e.target.id==="sheetMask") $("sheetMask").classList.remove("show"); });
$("dlgMask").addEventListener("click",e=>{ if(e.target.id==="dlgMask") $("dlgMask").classList.remove("show"); });

/* ================= 导航 ================= */
const TITLES = {home:"臻选生活馆",products:"产品库",price:"价格查询",vote:"新品投票",mine:"我的"};
function go(tab){
  state.tab=tab; state.pushed=null;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("pg-"+tab).classList.add("active");
  $("navTitle").textContent=TITLES[tab];
  $("navBack").style.display="none";
}
function push(id,title){
  state.pushed=id;
  $(id).classList.add("active"); $(id).scrollTop=0;
  $("navTitle").textContent=title;
  $("navBack").style.display="flex";
}
$("navBack").addEventListener("click",()=>{
  if(state.pushed){ $(state.pushed).classList.remove("active"); state.pushed=null; $("navTitle").textContent=TITLES[state.tab]; $("navBack").style.display="none"; }
});
$("tabbar").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t) go(t.dataset.tab); });

/* ================= 首页视频流 ================= */
function renderVideos(){
  $("videoList").innerHTML = videos.map((v,i)=>`
    <div class="vcard" data-v="${i}">
      <div class="thumb">
        <img src="${v.cover}" alt="" loading="lazy">
        ${v.pin?'<span class="pin-tag">置顶介绍</span>':""}
        <div class="play"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg></i></div>
        <span class="dur">${v.dur}</span>
      </div>
      <div class="vinfo">
        <div class="vtitle">${v.title}</div>
        <div class="vsrc">${v.sub}<span class="dot"></span>${v.dur.replace(":","′")}″</div>
      </div>
    </div>`).join("");
}
$("videoList").addEventListener("click",e=>{
  const c=e.target.closest(".vcard"); if(!c) return;
  const v=videos[+c.dataset.v];
  $("playerImg").src=v.cover; $("pTitle").textContent=v.title; $("pSub").textContent=v.sub;
  $("player").classList.add("show");
  setPlay(false);
});
function setPlay(playing){
  $("pPlayIc").style.display=playing?"none":"block";
  $("pPauseIc").style.display=playing?"block":"none";
  clearInterval(playerTimer);
  if(playing){ playerTimer=setInterval(()=>{ const b=$("pBar"); const w=Math.min(100,parseFloat(b.style.width||0)+0.5); b.style.width=w+"%"; if(w>=100) setPlay(false); },80); }
}
$("pbtn").addEventListener("click",()=>{ $("pBar").style.width=$("pBar").style.width||"0%"; setPlay($("pPlayIc").style.display!=="none"); });
$("pclose").addEventListener("click",()=>{ setPlay(false); $("player").classList.remove("show"); $("pBar").style.width="0%"; });

/* ================= 锁定页 ================= */
function lockHTML(what){
  return `<div class="locked">
    <div class="lock-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8a8a8e" stroke-width="1.8"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg></div>
    <h3>开通会员后查看</h3>
    <p>${what}仅对受邀会员开放。<br>请向管理员索取邀请码，在「我的」页面开通。</p>
    <button class="btn-primary" onclick="go('mine')">去开通会员</button>
  </div>`;
}

/* ================= 产品库 ================= */
let curCat="全部", curKw="";
function renderProducts(){
  if(!state.member){ $("productsInner").innerHTML=lockHTML("产品库"); return; }
  const lv=state.member.level;
  const list=products.filter(p=>!p.off)
    .filter(p=>curCat==="全部"||p.cat===curCat)
    .filter(p=>!curKw||p.name.includes(curKw)||p.no.toLowerCase().includes(curKw.toLowerCase()));
  $("productsInner").innerHTML=`
    <div class="search-wrap"><div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="搜索：名称 / 编号" value="${curKw}">
    </div></div>
    <div class="cats">${CATS.map(c=>`<div class="cat ${c===curCat?"on":""}" data-c="${c}">${c}</div>`).join("")}</div>
    <div class="pgrid">
      ${list.length?list.map(p=>`
        <div class="pcard" data-no="${p.no}">
          <img src="${p.img}" alt="" loading="lazy">
          <div class="pbody">
            <div class="pname">${p.name}</div>
            <div class="pno">编号 ${p.no}</div>
            <div class="pprice">¥${p.prices[lv]}<small>${LEVELS[lv]}价</small></div>
          </div>
        </div>`).join(""):'<div class="empty-tip">没有匹配的产品</div>'}
    </div>`;
  const si=$("searchInput");
  si.addEventListener("input",()=>{ curKw=si.value.trim(); renderProducts(); const n=$("searchInput"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); });
  $("productsInner").querySelectorAll(".cat").forEach(el=>el.addEventListener("click",()=>{ curCat=el.dataset.c; renderProducts(); }));
  $("productsInner").querySelectorAll(".pcard").forEach(el=>el.addEventListener("click",()=>openDetail(el.dataset.no)));
}
function openDetail(no){
  const p=products.find(x=>x.no===no); if(!p) return;
  const lv=state.member.level;
  $("detailInner").innerHTML=`
    <img class="detail-hero" src="${p.img}" alt="">
    <div class="detail-body">
      <h2>${p.name}</h2>
      <div class="detail-meta">编号 ${p.no} · ${p.cat}</div>
      <div class="price-box"><span class="pv">${p.prices[lv]}</span><span class="pl">${LEVELS[lv]}专属价</span></div>
      <div class="detail-desc"><b>产品介绍</b>${p.desc}</div>
      <div class="detail-desc" style="color:#9a9aa0;font-size:12px">价格已按你的会员等级展示，其他等级价格不可见。</div>
    </div>`;
  push("pg-detail","产品详情");
}

/* ================= 查价 ================= */
function renderPrice(){
  if(!state.member){ $("priceInner").innerHTML=lockHTML("价格查询"); return; }
  const lv=state.member.level;
  $("priceInner").innerHTML=`
    <div class="query-wrap">
      <div class="query-card">
        <label>输入产品编号，查询${LEVELS[lv]}价格</label>
        <div class="query-line">
          <input id="qInput" placeholder="例如 A-1024" maxlength="10">
          <button id="qBtn">查询</button>
        </div>
        <div class="query-hint">编号见产品包装或产品库列表，精确匹配。</div>
      </div>
      <div class="qresult" id="qResult"></div>
      <div class="qerr" id="qErr"></div>
    </div>`;
  const doQuery=()=>{
    const no=$("qInput").value.trim().toUpperCase();
    const r=$("qResult"), er=$("qErr");
    r.classList.remove("show"); er.classList.remove("show");
    if(!no){ toast("请输入产品编号"); return; }
    const p=products.find(x=>x.no===no);
    if(!p){ er.innerHTML=`<div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c0504d" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8" stroke-linecap="round"/><path d="M8.5 8.5l5 5M13.5 8.5l-5 5" stroke-linecap="round"/></svg></div><p>未找到该产品</p><span>请核对编号后重试</span>`; er.classList.add("show"); return; }
    if(p.off){ er.innerHTML=`<div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c0504d" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8" stroke-linecap="round"/></svg></div><p>该产品已下架</p><span>编号 ${p.no} · ${p.name}</span>`; er.classList.add("show"); return; }
    r.innerHTML=`<img src="${p.img}" alt=""><div class="qb">
      <div class="qn">${p.name}</div><div class="qno">编号 ${p.no}</div>
      <div class="qp"><span class="v">${p.prices[lv]}</span><span class="t">${LEVELS[lv]}价</span></div></div>`;
    r.classList.add("show");
  };
  $("qBtn").addEventListener("click",doQuery);
  $("qInput").addEventListener("keydown",e=>{ if(e.key==="Enter") doQuery(); });
}

/* ================= 投票 ================= */
function renderVotes(){
  $("voteList").innerHTML = votes.map(v=>`
    <div class="vote-card" data-id="${v.id}">
      <img src="${v.img}" alt="" loading="lazy">
      <div class="vb">
        <div class="vt">${v.title}</div>
        <div class="vm"><span class="badge ${v.doing?"doing":"done"}">${v.doing?"进行中":"已结束"}</span>${v.deadline}<span class="dot"></span>${v.voted} 人参与</div>
      </div>
    </div>`).join("");
  $("voteList").querySelectorAll(".vote-card").forEach(el=>el.addEventListener("click",()=>openVote(+el.dataset.id)));
}
function openVote(id){
  const v=votes.find(x=>x.id===id);
  const myVote=state.voted[id];
  const showResult = myVote!==undefined || !v.doing;
  $("voteDetailInner").innerHTML=`
    <img class="vote-hero" src="${v.img}" alt="">
    <div class="vote-body">
      <h2>${v.title}</h2>
      <div class="deadline"><span class="badge ${v.doing?"doing":"done"}">${v.doing?"进行中":"已结束"}</span>　${v.deadline}</div>
      <div class="intro">${v.intro}</div>
      <div class="vote-count">${v.voted} 人已参与${showResult?"，占比公示如下":"，投票后可查看占比"}</div>
      ${showResult ? v.options.map((o,i)=>`
        <div class="rbar ${myVote===i?"mine":""}"><div class="fill" data-w="${v.ratio[i]}"></div>
          <div class="rl"><span>${o}${myVote===i?'<span class="mine-tag">我的选择</span>':""}</span><b>${v.ratio[i]}%</b></div>
        </div>`).join("")
      : v.options.map((o,i)=>`
        <div class="opt ${state.selOpt[id]===i?"sel":""}" data-i="${i}">
          <span class="radio"></span><span class="ot">${o}</span>
        </div>`).join("")}
      ${showResult
        ? `<div class="vote-note">${v.doing?"你已投过票，每人限投一票":"投票已结束，结果公示"}</div>`
        : `<button class="vote-btn" id="voteBtn" ${state.selOpt[id]===undefined?"disabled":""}>投 票</button>
           <div class="vote-note">每人限投一票，提交后不可更改</div>`}
      <div class="share-row">
        <button id="shareGroup"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z" stroke-linejoin="round"/></svg>发给群</button>
        <button id="shareMoment"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.8 5.2 3.8 8.5s-1.2 6.2-3.8 8.5c-2.6-2.3-3.8-5.2-3.8-8.5s1.2-6.2 3.8-8.5z"/></svg>分享朋友圈</button>
      </div>
      <div class="vote-note" style="margin-top:14px">分享内容不含任何价格信息</div>
    </div>`;
  push("pg-voteDetail","投票详情");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $("voteDetailInner").querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%");
  }));
  $("voteDetailInner").querySelectorAll(".opt").forEach(el=>el.addEventListener("click",()=>{
    state.selOpt[id]=+el.dataset.i; openVote(id);
  }));
  const vb=$("voteBtn");
  if(vb) vb.addEventListener("click",()=>{
    if(!state.member){
      openDlg(`<h4>投票仅限会员</h4><p>你是游客身份，请输入邀请码开通会员后再参与投票。</p>
        <div class="dbtns"><button onclick="document.getElementById('dlgMask').classList.remove('show')">取消</button>
        <button class="ok" onclick="document.getElementById('dlgMask').classList.remove('show');go('mine')">去开通</button></div>`);
      return;
    }
    state.voted[id]=state.selOpt[id];
    votes.find(x=>x.id===id).voted++;
    toast("投票成功");
    openVote(id);
  });
  $("shareGroup").addEventListener("click",()=>toast("已唤起微信群分享（演示环境）"));
  $("shareMoment").addEventListener("click",()=>openSheet(`
    <h4>朋友圈分享说明</h4>
    <p>朋友圈打开的小程序处于「单页模式」：用户只能看到本投票页，无法切换到其他 Tab，页面顶部会常驻「进入小程序」引导按钮，点击后才进入完整小程序。</p>
    <button class="btn-primary" onclick="document.getElementById('sheetMask').classList.remove('show')">知道了</button>`));
}

/* ================= 我的 ================= */
function renderMine(){
  const m=state.member;
  $("mineInner").innerHTML=`
    <div class="mine-head">
      <img src="${IMG("minimal flat vector avatar of a smiling person, neutral background, clean modern illustration")+"square"}" alt="">
      <div><div class="mn">微信用户_8848</div>
        <div class="ms">${m?"已开通会员 · "+new Date().toISOString().slice(0,10)+" 加入":"游客身份 · 核心功能未解锁"}</div>
        ${m?`<span class="lv-badge">${LEVELS[m.level]}</span>`:""}
      </div>
    </div>
    ${m?`<div class="menu">
      <div class="mi" id="miLevel"><span>我的等级</span><span style="color:var(--gold);font-weight:600">${LEVELS[m.level]}</span></div>
      <div class="mi" id="miCode"><span>开通所用邀请码</span><span style="font-family:ui-monospace,Menlo,monospace;color:var(--sub)">${m.code}</span></div>
    </div>`:`<div class="activate-card">
      <h3>开通会员</h3>
      <div class="sub">输入管理员发给你的 8 位邀请码</div>
      <input id="codeInput" placeholder="________" maxlength="8">
      <button class="btn-primary" id="actBtn">开通会员</button>
      <div class="tip">没有邀请码？请向管理员索取</div>
    </div>`}
    <div class="menu">
      <div class="mi" id="miKefu"><span>联系客服</span><span class="arrow">›</span></div>
      <div class="mi" id="miAbout"><span>关于小程序</span><span class="arrow">›</span></div>
    </div>
    <div style="text-align:center;font-size:11px;color:#b9b9c0;margin-top:6px">臻选生活馆 · 邀请制会员服务</div>`;
  if(!m){
    $("actBtn").addEventListener("click",()=>{
      const code=$("codeInput").value.trim().toUpperCase();
      if(!code){ toast("请输入邀请码"); return; }
      if(code in CODES){
        state.member={level:CODES[code],code};
        toast("开通成功，欢迎加入");
        syncAll();
        openSheet(`<h4>开通成功</h4><p>你已成为${LEVELS[state.member.level]}，产品库与查价功能已解锁。</p>
          <button class="btn-primary" onclick="document.getElementById('sheetMask').classList.remove('show');go('products')">去产品库看看</button>`);
      }else if(code in USED_CODES){ toast(USED_CODES[code],2200);
      }else if(code in EXP_CODES){ toast(EXP_CODES[code],2200);
      }else{ toast("邀请码不存在，请核对后重试",2200); }
    });
  }else{
    $("miCode").addEventListener("click",()=>toast("同一微信账号只需开通一次，你已是会员",2200));
    $("miLevel").addEventListener("click",()=>toast("等级调整请联系管理员"));
  }
  $("miKefu").addEventListener("click",()=>openSheet(`
    <h4>联系客服</h4><p>添加管理员微信咨询（演示）<br><b style="color:#1a1a1a;font-size:16px;letter-spacing:1px">zhenxuan-kefu</b><br>长按复制，微信搜索添加</p>
    <button class="btn-primary" onclick="document.getElementById('sheetMask').classList.remove('show')">关闭</button>`));
  $("miAbout").addEventListener("click",()=>openSheet(`
    <h4>臻选生活馆</h4><p>邀请制授权产品会员服务小程序<br>版本 v1.0.0（Demo）</p>
    <button class="btn-primary" onclick="document.getElementById('sheetMask').classList.remove('show')">关闭</button>`));
}

/* ================= 全局同步 ================= */
function syncAll(){
  renderMine(); renderProducts(); renderPrice();
  $("whoami").textContent = state.member? LEVELS[state.member.level] : "游客";
  if(state.pushed==="pg-voteDetail"){ /* 保持在投票详情 */ }
}
document.querySelectorAll(".copy-btn").forEach(b=>b.addEventListener("click",()=>{
  navigator.clipboard?.writeText(b.dataset.c); toast("已复制："+b.dataset.c);
}));
$("resetBtn").addEventListener("click",()=>{
  state={member:null,voted:{},selOpt:{},tab:"home",pushed:null};
  votes[0].voted=86;
  syncAll(); go("home"); toast("已重置为游客身份");
});

/* ================= 初始化 ================= */
renderVideos(); renderVotes(); syncAll();
</script>
</body>
</html>
